<div mat-dialog-title>
  <h1>Registro de ciclo</h1>
</div>
<form [formGroup]="enrollmentNewForm" (ngSubmit)="onSubmit()">
  <div mat-dialog-content class="content">
    <div formGroupName="student">
      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Estudiante:</mat-label>
          <mat-select formControlName="id">
            <mat-option>
              <input matInput [formControl]="studentFilter" placeholder="Buscar estudiante..." (click)="$event.stopPropagation()" style="width:100%; border:none; outline:none; padding: 4px 0;">
            </mat-option>
            @for (student of filteredStudents; track student) {
              <mat-option [value]="student.id">{{student.profile.name}} {{student.profile.parentLastName}}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div formGroupName="course">
      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Curso:</mat-label>
          <mat-select formControlName="id">
            <mat-option>
              <input matInput [formControl]="courseFilter" placeholder="Buscar curso..." (click)="$event.stopPropagation()" style="width:100%; border:none; outline:none; padding: 4px 0;">
            </mat-option>
            @for (course of filteredCourses; track course) {
              <mat-option [value]="course.id">{{course.subject.description}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Porcentaje de beca:</mat-label>
        <input matInput placeholder="i.e 10" type="text" formControlName="scholarshipPercent">
      </mat-form-field>
    </div>
  </div>
  <div mat-dialog-actions class="action-btns">
    <button style="margin: 10px;" mat-raised-button color="basic" type="submit">Crear</button>
    <button mat-raised-button type="button" color="warn" [mat-dialog-close]="false">Cancelar</button>
  </div>
</form>
